[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-finance-copilot-backend"
version = "0.1.0"
description = "SME Finance Copilot - agent backend (FastAPI)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # sqlmodel 0.0.23+ rejects timezone-naive datetimes, which the seed data uses
  "sqlmodel>=0.0.21,<0.0.23",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
  "slowapi>=0.1.9",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
