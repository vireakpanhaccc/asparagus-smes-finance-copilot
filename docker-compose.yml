services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smefinance
      POSTGRES_PASSWORD: smefinance
      POSTGRES_DB: smefinance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smefinance"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smefinance:smefinance@db:5432/smefinance
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_OWNER_TOKEN: ${OWNER_DEMO_TOKEN:-demo-owner-token}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
